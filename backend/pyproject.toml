[project]
name = "pbi-report-generator"
version = "0.1.0"
description = "AI-powered Power BI (.pbip) report generator — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "litellm>=1.40",
    "jsonschema>=4.22",
    "cryptography>=42.0",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "sse-starlette>=2.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Heavier / per-provider connectors kept optional so core installs stay lean.
warehouses = [
    "snowflake-sqlalchemy>=1.6",
    "google-cloud-bigquery>=3.25",
    "sqlalchemy-bigquery>=1.11",
    "databricks-sql-connector>=3.3",
    "pymysql>=1.1",
    "psycopg2-binary>=2.9",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "vcrpy>=6.0",
    "ruff>=0.5",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends() in defaults is the idiomatic FastAPI pattern.
ignore = ["E501", "B008"]
